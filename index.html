<!DOCTYPE html>
<html lang="en">
  <head>
      <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandarin Tone Trainer</title>

  </head>
  <body>
    <div id="app">

      <div id="menu-screen">
        <h1 class="main-title">MANDARIN<br>CONSTRUCTOR</h1>

        <div class="menu-stack">
          <button id="start-tones-btn" class="menu-block red-block">
            <span class="icon">■</span> TONE TRAINER
          </button>

          <button class="menu-block yellow-block disabled">
            <span class="icon">▲</span> INITIALS & ENDINGS
          </button>

          <button class="menu-block blue-block disabled">
            <span class="icon">●</span> WORD TRAINER
          </button>
        </div>
      </div>

      <div id="game-screen" class="hidden">
        <button id="back-to-menu-btn">✖ MENU</button>

        <div class="card">
          <div id="pinyin-display">
            <div>...</div>
            <div>...</div>
          </div>
        </div>

        <div class="options">
          <button class="tone-btn pop-up" data-tone="1">1</button>
          <button class="tone-btn pop-up" data-tone="2">2</button>
          <button class="tone-btn pop-up" data-tone="3">3</button>
          <button class="tone-btn pop-up" data-tone="4">4</button>
        </div>

        <button id="play-btn">LISTEN</button>
        <div id="feedback"></div>
      </div>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
