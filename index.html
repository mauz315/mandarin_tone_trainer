<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandarin Tone Trainer - Neo-Sponsor Badge Collage</title>

    <!-- Google Fonts: Diverse Typographic Collision -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,700;0,800;1,800;1,900&family=Space+Grotesk:ital,wght@0,500;0,700;1,700&family=Space+Mono:ital,wght@0,400;0,700;1,700&family=Playfair+Display:ital,wght@0,700;1,700&family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet" />

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#181a1d] text-slate-900 font-grotesk min-h-[100dvh] antialiased selection:bg-badge-pink selection:text-white p-2 md:p-6 flex flex-col items-center justify-center">

    <!-- POSTER CANVAS CONTAINER (Focused, Centered, No Standard Topbar) -->
    <main id="app" class="w-full max-w-xl md:max-w-2xl lg:max-w-3xl relative rounded-3xl overflow-hidden border-[3.5px] border-black shadow-[8px_8px_0px_#000000] min-h-[100dvh] md:min-h-[760px] flex flex-col justify-between transition-colors duration-500 bg-canvas-acid">
      <!-- Halftone Texture Background Layer -->
      <div class="absolute inset-0 bg-halftone-dots pointer-events-none z-0"></div>

      <!-- Decorative Canvas Vector Accents: 4-Point Starbursts & Stencil Stamps -->
      <div class="absolute top-1/3 -left-4 pointer-events-none z-0 text-black/20 text-7xl select-none">✦</div>
      <div class="absolute bottom-1/4 -right-4 pointer-events-none z-0 text-black/15 text-8xl select-none">✦</div>

      <!-- ======================================================== -->
      <!-- [01] MAIN MENU HUB (#menu-screen) -->
      <!-- Asymmetric Graphic Badge Collage, No Top Header -->
      <!-- ======================================================== -->
      <div id="menu-screen" class="relative z-10 w-full min-h-[100dvh] md:min-h-[760px] p-4 sm:p-7 flex flex-col justify-between">
        <!-- Brand Identity Marquee Badge Area (Collage Anchor) -->
        <section class="w-full pt-2 pb-4">
          <div class="flex items-center justify-between mb-3">
            <span class="bg-black text-canvas-acid font-mono text-[10px] sm:text-xs font-black px-2.5 py-1 rounded border border-black uppercase tracking-wider">
              SYS // VER 2.4.0
            </span>
            <span class="font-mono text-xs font-bold text-black/70 flex items-center gap-1.5">
              <span class="w-2.5 h-2.5 rounded-full bg-badge-red animate-pulse border border-black"></span>
              ACOUSTIC MATRIX
            </span>
          </div>

          <!-- Master Typographic Headline Cluster -->
          <div class="relative">
            <h1 class="font-speed font-black italic tracking-tighter text-4xl sm:text-5xl md:text-6xl uppercase text-black leading-[0.88] select-none">
              MANDARIN<br />
              <span class="inline-block bg-black text-canvas-acid px-2 py-0.5 mt-1 -rotate-1 shadow-hard-black">CONSTRUCTOR</span>
            </h1>
          </div>
        </section>

        <!-- ASYMMETRIC BADGE COLLAGE MENU ITEMS (#main-menu) -->
        <div id="main-menu" class="w-full my-auto flex flex-col gap-3 py-3">
          <!-- 1. #start-tones-btn: The Heavy Speed Lozenge Ticket -->
          <button id="start-tones-btn" class="w-full text-left relative group -rotate-[1deg] hover:rotate-0 transition-transform duration-200 active-collapse">
            <div class="bg-badge-butter border-[3px] border-black rounded-2xl p-4 sm:p-5 shadow-hard-black group-hover:bg-[#fffaab] transition-colors relative overflow-hidden">
              <!-- Inline Graphic 3-Pill Slanted Lozenge Badge SVG -->
              <div class="absolute -right-6 -bottom-6 opacity-20 pointer-events-none group-hover:opacity-30 transition-opacity">
                <svg fill="none" height="100" viewBox="0 0 140 100" width="140">
                  <rect fill="#000" height="16" rx="8" transform="rotate(-25 10 20)" width="45" x="10" y="20"></rect>
                  <rect fill="#000" height="16" rx="8" transform="rotate(-25 40 20)" width="55" x="40" y="20"></rect>
                  <rect fill="#000" height="16" rx="8" transform="rotate(-25 75 20)" width="60" x="75" y="20"></rect>
                </svg>
              </div>
              <div class="flex items-start justify-between gap-3 relative z-10">
                <div class="space-y-1">
                  <div class="flex items-center gap-2">
                    <span class="bg-black text-badge-butter font-mono text-[11px] font-bold px-2 py-0.5 rounded">01</span>
                    <span class="font-speed font-black italic tracking-tight text-2xl sm:text-3xl text-black uppercase">
                      Tone Trainer
                    </span>
                  </div>
                  <p class="font-mono text-xs sm:text-sm text-black/80 font-bold max-w-md pt-0.5">
                    Master the four tones of Mandarin through isolated audio drills.
                  </p>
                </div>
                <div class="w-12 h-12 rounded-xl bg-black text-canvas-acid border-2 border-black flex items-center justify-center shrink-0 shadow-hard-black group-hover:scale-105 transition-transform">
                  <span class="material-symbols-outlined text-2xl">graphic_eq</span>
                </div>
              </div>
            </div>
          </button>

          <!-- Staggered Two-Column Row for Badges 2 and 3 -->
          <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 w-full">
            <!-- 2. #open-submenu-btn: Retro Stadium Racetrack Oval Badge -->
            <button id="open-submenu-btn" class="sm:col-span-6 text-left relative group rotate-[1.2deg] hover:rotate-0 transition-transform duration-200 active-collapse">
              <div class="bg-badge-lavender border-[3px] border-black rounded-3xl p-4 sm:p-5 shadow-hard-black group-hover:bg-[#afb6ff] transition-colors h-full flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-2">
                    <span class="bg-badge-pink text-white font-mono text-[10px] font-black px-2 py-0.5 rounded-full border border-black">
                      PHONOLOGY
                    </span>
                    <span class="w-7 h-7 rounded-full bg-white border-2 border-black flex items-center justify-center font-chinese font-black text-xs">
                      声
                    </span>
                  </div>
                  <h3 class="font-speed font-black italic text-xl sm:text-2xl text-black uppercase leading-tight mb-1">
                    Initials &amp; Endings
                  </h3>
                  <p class="font-mono text-xs text-black/80 font-bold">
                    Focus on Pinyin phonetic components.
                  </p>
                </div>
                <div class="mt-3 pt-2 border-t-2 border-black/20 flex items-center justify-between text-[11px] font-mono font-bold text-black">
                  <span>SUBMENU ➔</span>
                  <span class="font-chinese font-bold text-black/60">声母 / 韵母</span>
                </div>
              </div>
            </button>

            <!-- 3. #open-library-btn: Industrial Ticket / Sound Matrix Tag -->
            <button id="open-library-btn" class="sm:col-span-6 text-left relative group -rotate-[1deg] hover:rotate-0 transition-transform duration-200 active-collapse">
              <div class="bg-badge-cobalt text-white border-[3px] border-black rounded-2xl p-4 sm:p-5 shadow-hard-black group-hover:bg-[#1f5bff] transition-colors h-full flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-2">
                    <span class="bg-canvas-acid text-black font-mono text-[10px] font-black px-2 py-0.5 rounded border border-black">
                      COMBINATORIAL
                    </span>
                    <span class="material-symbols-outlined text-canvas-acid text-xl">dataset</span>
                  </div>
                  <h3 class="font-speed font-black italic text-xl sm:text-2xl text-white uppercase leading-tight mb-1">
                    Audio Library
                  </h3>
                  <p class="font-mono text-xs text-white/90 font-bold">
                    Explore all Pinyin sound combinations.
                  </p>
                </div>
                <div class="mt-3 pt-2 border-t-2 border-white/20 flex items-center justify-between text-[11px] font-mono font-bold text-canvas-acid">
                  <span>OPEN MATRIX ✦</span>
                  <span class="text-white/60">1,300+ SYLLABLES</span>
                </div>
              </div>
            </button>
          </div>

          <!-- 4. #start-words-btn: Industrial Dark Graphic Patch with Diagonal Stripes -->
          <button id="start-words-btn" class="w-full text-left relative opacity-75 cursor-not-allowed rotate-[-0.5deg]" disabled>
            <div class="bg-[#1c1d21] border-[3px] border-black rounded-2xl p-4 sm:p-5 shadow-hard-black relative overflow-hidden">
              <!-- Caution Stripe Horizon Indicator -->
              <div class="absolute top-0 right-0 w-36 h-full caution-stripe opacity-40"></div>
              <div class="flex items-center justify-between gap-4 relative z-10">
                <div class="space-y-1">
                  <div class="flex items-center gap-2">
                    <span class="bg-badge-red text-white font-mono text-[10px] font-black px-2 py-0.5 rounded uppercase">
                      LOCKED
                    </span>
                    <h3 class="font-speed font-black italic text-xl sm:text-2xl text-white/70 uppercase">
                      Word Trainer
                    </h3>
                  </div>
                  <p class="font-mono text-xs text-white/50 font-bold">
                    Coming Soon
                  </p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-black/60 border border-white/20 flex items-center justify-center text-white/40">
                  <span class="material-symbols-outlined text-xl">lock</span>
                </div>
              </div>
            </div>
          </button>
        </div>

        <!-- SUBMENU CONTAINER (#submenu) - Inside Menu Screen -->
        <div id="submenu" class="w-full my-auto flex-col gap-3 py-3 hidden">
          <!-- Return Control -->
          <div class="flex items-center justify-between mb-2">
            <button id="close-submenu-btn" class="bg-black text-white hover:bg-badge-pink px-4 py-2 rounded-full border-2 border-black font-mono text-xs font-bold uppercase tracking-wider flex items-center gap-2 shadow-hard-black transition-colors active-collapse">
              <span class="material-symbols-outlined text-sm">arrow_back</span> BACK TO MENU
            </button>
            <span class="font-mono text-xs font-bold text-black/60 uppercase">PHONETIC ANATOMY</span>
          </div>

          <!-- Submenu Badges -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
            <!-- Initials Sub-button -->
            <button id="start-initials-btn" class="text-left bg-badge-butter border-[3px] border-black rounded-2xl p-5 shadow-hard-black -rotate-1 hover:rotate-0 transition-transform active-collapse">
              <div class="flex justify-between items-start mb-3">
                <span class="font-chinese font-black text-2xl bg-black text-canvas-acid px-2 py-1 rounded-lg">zh</span>
                <span class="font-mono text-[10px] font-black bg-white border border-black px-1.5 py-0.5 rounded">23 PHONEMES</span>
              </div>
              <h3 class="font-speed font-black italic text-2xl text-black uppercase mb-1">Initials</h3>
              <p class="font-mono text-xs text-black/80 font-bold">Train your ear to recognize the starting consonants.</p>
            </button>

            <!-- Endings Sub-button -->
            <button id="start-endings-btn" class="text-left bg-badge-pink text-white border-[3px] border-black rounded-2xl p-5 shadow-hard-black rotate-1 hover:rotate-0 transition-transform active-collapse">
              <div class="flex justify-between items-start mb-3">
                <span class="font-chinese font-black text-2xl bg-black text-badge-butter px-2 py-1 rounded-lg">ang</span>
                <span class="font-mono text-[10px] font-black bg-white text-black border border-black px-1.5 py-0.5 rounded">36 VOWELS</span>
              </div>
              <h3 class="font-speed font-black italic text-2xl text-white uppercase mb-1">Endings</h3>
              <p class="font-mono text-xs text-white/90 font-bold">Master the vowels and nasal endings.</p>
            </button>
          </div>
        </div>

        <!-- Bottom Graphic Footer Strip -->
        <footer class="w-full pt-3 pb-1 flex items-center justify-between font-mono text-[11px] font-bold text-black/60 border-t-2 border-black/15">
          <span>[TONE DRILLS &amp; PHONOLOGY]</span>
          <span class="flex items-center gap-1 font-chinese text-black">
            声调训练器 ✦
          </span>
        </footer>
      </div>

      <!-- ======================================================== -->
      <!-- [02] TONE TRAINER GAME SCREEN (#game-screen) -->
      <!-- Zero scroll, 3-pill slanted hero button, tactile keycaps -->
      <!-- ======================================================== -->
      <div id="game-screen" class="relative z-10 w-full min-h-[100dvh] md:min-h-[760px] p-4 sm:p-6 flex flex-col justify-between overflow-hidden hidden">
        <!-- Top Action Bar -->
        <header class="w-full flex items-center justify-between shrink-0 mb-1">
          <button id="back-to-menu-btn" class="bg-black text-white hover:bg-badge-pink px-3.5 py-1.5 rounded-full border-2 border-black font-mono text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 shadow-hard-black transition-colors active-collapse">
            <span class="material-symbols-outlined text-sm">arrow_back</span> MENU
          </button>
          <div id="game-mode-badge" class="bg-white border-2 border-black px-3 py-1 rounded-full font-mono text-xs font-bold shadow-hard-black uppercase">
            DRILL // TONE TRAINER
          </div>
        </header>

        <!-- Center Audio Stimulus Container -->
        <section class="w-full flex flex-col items-center justify-center shrink-0 my-auto py-2">
          <!-- Horizon Band with Hero Play Button -->
          <div class="w-full bg-horizon-forest border-[3px] border-black rounded-3xl p-4 sm:p-5 shadow-hard-black flex flex-col items-center relative overflow-hidden">
            <!-- Subtle diagonal speed lines on horizon background -->
            <div class="absolute -top-6 -right-6 opacity-10 pointer-events-none">
              <svg fill="none" height="120" viewBox="0 0 160 120" width="160">
                <rect fill="#fff" height="20" rx="10" transform="rotate(-30 10 20)" width="70" x="10" y="20"></rect>
                <rect fill="#fff" height="20" rx="10" transform="rotate(-30 50 20)" width="85" x="50" y="20"></rect>
                <rect fill="#fff" height="20" rx="10" transform="rotate(-30 95 20)" width="95" x="95" y="20"></rect>
              </svg>
            </div>

            <button id="play-btn" class="bg-canvas-acid hover:bg-[#a6e612] active-collapse border-[3.5px] border-black rounded-2xl px-6 py-3.5 shadow-hard-black flex items-center gap-3 transition-transform relative z-10 cursor-pointer">
              <span class="material-symbols-outlined text-4xl text-black">volume_up</span>
              <span class="font-speed font-black italic text-xl uppercase text-black">PLAY SOUND</span>
            </button>

            <div id="feedback" class="mt-2.5 font-mono text-xs text-white/90 uppercase font-bold min-h-[28px] flex items-center justify-center text-center">
              [IDENTIFY THE CORRECT TONE CONTOUR]
            </div>
          </div>

          <!-- Pinyin & Hanzi Display Card -->
          <div id="pinyin-display" class="mt-3 bg-white border-[3px] border-black rounded-2xl p-3 sm:p-4 shadow-hard-black text-center w-full max-w-sm flex flex-col items-center justify-center gap-1 min-h-[96px]">
            <div class="font-chinese font-black text-5xl text-black leading-none">...</div>
            <div class="font-speed font-black italic text-2xl text-black">...</div>
          </div>

          <!-- Explanation Box for Initials/Endings -->
          <div id="explanation-box" class="hidden mt-3 p-3 bg-white border-2 border-black rounded-xl text-black text-xs text-center w-full max-w-sm shadow-hard-black"></div>
        </section>

        <!-- 4 Tactile Tone Option Badges (2x2 Matrix) -->
        <section class="options grid grid-cols-2 gap-2.5 sm:gap-3 shrink-0 mb-1 w-full">
          <button class="tone-btn h-14 sm:h-16 bg-badge-cobalt text-white border-[3px] border-black rounded-2xl p-3 flex items-center justify-between shadow-hard-black active-collapse font-speed font-black text-2xl transition-all" data-index="0">
            <div class="flex items-center gap-2">
              <span class="text-canvas-acid option-text">1</span>
              <span class="tone-hint text-xs font-mono font-bold uppercase tracking-tight text-white/90 hidden sm:inline">High</span>
            </div>
            <span class="font-mono text-[10px] bg-black text-white px-2 py-0.5 rounded">[1]</span>
          </button>
          <button class="tone-btn h-14 sm:h-16 bg-badge-pink text-white border-[3px] border-black rounded-2xl p-3 flex items-center justify-between shadow-hard-black active-collapse font-speed font-black text-2xl transition-all" data-index="1">
            <div class="flex items-center gap-2">
              <span class="text-badge-butter option-text">2</span>
              <span class="tone-hint text-xs font-mono font-bold uppercase tracking-tight text-white/90 hidden sm:inline">Rising</span>
            </div>
            <span class="font-mono text-[10px] bg-black text-white px-2 py-0.5 rounded">[2]</span>
          </button>
          <button class="tone-btn h-14 sm:h-16 bg-badge-red text-white border-[3px] border-black rounded-2xl p-3 flex items-center justify-between shadow-hard-black active-collapse font-speed font-black text-2xl transition-all" data-index="2">
            <div class="flex items-center gap-2">
              <span class="text-white option-text">3</span>
              <span class="tone-hint text-xs font-mono font-bold uppercase tracking-tight text-white/90 hidden sm:inline">Dipping</span>
            </div>
            <span class="font-mono text-[10px] bg-black text-white px-2 py-0.5 rounded">[3]</span>
          </button>
          <button class="tone-btn h-14 sm:h-16 bg-canvas-acid text-black border-[3px] border-black rounded-2xl p-3 flex items-center justify-between shadow-hard-black active-collapse font-speed font-black text-2xl transition-all" data-index="3">
            <div class="flex items-center gap-2">
              <span class="text-black option-text">4</span>
              <span class="tone-hint text-xs font-mono font-bold uppercase tracking-tight text-black/80 hidden sm:inline">Falling</span>
            </div>
            <span class="font-mono text-[10px] bg-black text-white px-2 py-0.5 rounded">[4]</span>
          </button>
        </section>

        <!-- Floating Action Button Container (Correct / Try Again Icons) -->
        <div id="fab-container" class="fixed bottom-8 right-8 z-40 hidden"></div>
      </div>

      <!-- ======================================================== -->
      <!-- [03] AUDIO LIBRARY SCREEN (#audio-library-screen) -->
      <!-- Twin vertical tumbler columns in a technical dual-column chassis -->
      <!-- ======================================================== -->
      <div id="audio-library-screen" class="relative z-10 w-full min-h-[100dvh] md:min-h-[760px] p-4 sm:p-6 flex flex-col justify-between overflow-hidden hidden">
        <!-- Top Action Bar with Floating Return Control -->
        <header class="w-full flex items-center justify-between shrink-0 mb-1">
          <button id="back-to-main-menu-btn" class="bg-black text-white hover:bg-badge-pink px-3.5 py-1.5 rounded-full border-2 border-black font-mono text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 shadow-hard-black transition-colors active-collapse">
            <span class="material-symbols-outlined text-sm">arrow_back</span> MENU
          </button>
          <div class="bg-white border-2 border-black px-3 py-1 rounded-full font-mono text-xs font-bold shadow-hard-black flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-badge-cobalt"></span>
            <span>PINYIN COMBINATORIAL CHASSIS</span>
          </div>
        </header>

        <!-- Contained Scroller Chassis Section -->
        <div class="w-full max-w-sm sm:max-w-md mx-auto my-auto flex flex-col gap-2 py-2">
          <!-- Chassis Header Labels -->
          <div class="grid grid-cols-12 gap-2 px-1 shrink-0">
            <div class="col-span-5 text-center font-speed font-black text-xs tracking-wider uppercase bg-black text-canvas-acid py-1.5 rounded-md border border-black shadow-hard-black">
              INITIAL (声母)
            </div>
            <div class="col-span-7 text-center font-speed font-black text-xs tracking-wider uppercase bg-black text-badge-pink py-1.5 rounded-md border border-black shadow-hard-black">
              FINAL / ENDING (韵母)
            </div>
          </div>

          <!-- TWIN TUMBLER DRUM PICKER CHASSIS (#initials-scroller & #finals-scroller) -->
          <div class="h-[280px] sm:h-[320px] grid grid-cols-12 gap-2 relative rounded-2xl bg-white/95 border-[3.5px] border-black shadow-hard-black p-2 overflow-hidden">
            <!-- Central Optical Target Highlight Bar -->
            <div class="pointer-events-none absolute inset-x-2 top-1/2 -translate-y-1/2 h-11 sm:h-12 rounded-xl bg-canvas-acid/40 border-2 border-black z-0 shadow-inner flex items-center justify-between px-3">
              <span class="text-[9px] font-mono font-black uppercase text-black/50">FOCUS ✦</span>
              <span class="text-[9px] font-mono font-black uppercase text-black/50">✦ ALIGNED</span>
            </div>

            <!-- Initials Scroller Column (#initials-scroller) -->
            <div id="initials-scroller" class="col-span-5 h-full relative z-10 keen-slider keen-slider--vertical overflow-hidden picker-wheel-mask">
            </div>

            <!-- Finals Scroller Column (#finals-scroller) -->
            <div id="finals-scroller" class="col-span-7 h-full relative z-10 keen-slider keen-slider--vertical overflow-hidden picker-wheel-mask border-l-2 border-black/10">
            </div>
          </div>

          <!-- AUDITION TRIGGER BAR & SELECTION DISPLAY (#library-selection-display & #library-main-play-btn) -->
          <section class="p-3 rounded-2xl bg-badge-butter border-[3px] border-black shadow-hard-black flex items-center justify-between shrink-0">
            <div id="library-selection-display" class="font-speed font-black text-xl sm:text-2xl text-black flex items-center gap-2">
              Select...
            </div>
            <button id="library-main-play-btn" class="min-h-[46px] px-4 rounded-xl bg-black text-canvas-acid flex items-center gap-2 shadow-hard-black hover:bg-badge-pink hover:text-white transition-all active-collapse shrink-0 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed" disabled title="Audition Tones">
              <span class="material-symbols-outlined text-2xl">play_arrow</span>
              <span class="font-mono text-xs font-black uppercase">AUDITION 4 TONES</span>
            </button>
          </section>
        </div>

        <!-- 4-TONE MODAL (#library-tone-modal) -->
        <div id="library-tone-modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-canvas-acid border-[3.5px] border-black p-6 rounded-3xl shadow-hard-black-lg max-w-sm w-full flex flex-col items-center">
            <div class="bg-black text-white px-3 py-1 rounded-full font-mono text-xs font-bold uppercase mb-2">
              SELECT TONE CONTOUR
            </div>
            <h3 id="modal-pinyin-display" class="font-speed font-black italic text-5xl text-black my-2">ma</h3>
            <div class="grid grid-cols-4 gap-2 w-full mt-4">
              <button class="tone-select-btn h-14 rounded-2xl bg-badge-butter border-2 border-black font-speed font-black text-2xl shadow-hard-black hover:bg-white active-collapse" data-tone="1">1</button>
              <button class="tone-select-btn h-14 rounded-2xl bg-badge-lavender border-2 border-black font-speed font-black text-2xl shadow-hard-black hover:bg-white active-collapse" data-tone="2">2</button>
              <button class="tone-select-btn h-14 rounded-2xl bg-badge-pink text-white border-2 border-black font-speed font-black text-2xl shadow-hard-black hover:bg-white active-collapse" data-tone="3">3</button>
              <button class="tone-select-btn h-14 rounded-2xl bg-badge-cobalt text-white border-2 border-black font-speed font-black text-2xl shadow-hard-black hover:bg-white active-collapse" data-tone="4">4</button>
            </div>
            <button id="close-modal-btn" class="mt-6 font-mono text-xs font-black uppercase bg-black text-white px-5 py-2 rounded-full border border-black hover:bg-badge-red transition-colors active-collapse cursor-pointer">
              CLOSE MODAL ✕
            </button>
          </div>
        </div>
      </div>

    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
