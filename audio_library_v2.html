<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Library (CSS Scroll)</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary": "#ffffff", "secondary-container": "#6c98ff", "on-secondary-container": "#002f76", "inverse-surface": "#2a322b", "tertiary-fixed-dim": "#f5bf22", "error": "#ba1a1a", "surface-container": "#e7f0e5", "surface-container-high": "#e2ebdf", "surface-container-highest": "#dce5d9", "error-container": "#ffdad6", "on-primary-fixed-variant": "#92001d", "on-tertiary-fixed-variant": "#5a4300", "outline-variant": "#e4bebc", "surface-tint": "#bb142c", "on-secondary-fixed": "#001946", "on-surface-variant": "#5b403f", "tertiary-container": "#745800", "on-tertiary-fixed": "#251a00", "on-error-container": "#93000a", "on-error": "#ffffff", "on-tertiary-container": "#ffcf55", "tertiary": "#574100", "inverse-primary": "#ffb3b1", "surface": "#f3fcf0", "secondary-fixed": "#dae2ff", "secondary-fixed-dim": "#b1c5ff", "on-secondary-fixed-variant": "#00419e", "primary": "#8e001b", "tertiary-fixed": "#ffdf98", "on-secondary": "#ffffff", "primary-container": "#b7102a", "background": "#f3fcf0", "inverse-on-surface": "#eaf3e7", "surface-container-lowest": "#ffffff", "surface-dim": "#d4ddd1", "on-primary-container": "#ffc7c5", "outline": "#8f6f6e", "on-primary-fixed": "#410007", "on-background": "#161d16", "on-primary": "#ffffff", "surface-variant": "#dce5d9", "surface-container-low": "#edf6ea", "surface-bright": "#f3fcf0", "primary-fixed-dim": "#ffb3b1", "on-surface": "#161d16", "primary-fixed": "#ffdad8", "secondary": "#2559bd"
            },
            fontFamily: { "headline": ["Space Grotesk"], "body": ["Plus Jakarta Sans"], "label": ["Space Grotesk"] },
          },
        },
      }
    </script>
    <style>
      .scroller {
        scroll-snap-type: y mandatory;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
      }
      .scroller li { scroll-snap-align: center; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="bg-surface font-body text-on-surface h-[100dvh] overflow-hidden flex flex-col">
    <header class="flex justify-between items-center w-full px-6 py-4 shrink-0">
      <a href="/index.html" class="font-label text-xs font-bold tracking-widest text-on-surface/40 hover:text-primary uppercase flex items-center gap-2 transition-colors">
        <span class="material-symbols-outlined text-sm">arrow_back</span> MAIN MENU
      </a>
      <h1 class="font-headline font-bold text-primary uppercase">Library V2 (CSS)</h1>
    </header>

    <main class="flex-1 grid grid-cols-12 gap-2 overflow-hidden relative p-4">
      <!-- Scrollers -->
      <div id="library-scrollers" class="col-span-12 grid grid-cols-12 gap-2 transition-opacity duration-300">
        <div id="initials-scroller" class="scroller col-span-5 h-full overflow-y-auto no-scrollbar">
          <ul id="initials-list" class="space-y-1"></ul>
        </div>
        <div id="finals-scroller" class="scroller col-span-7 h-full overflow-y-auto no-scrollbar">
          <ul id="finals-list" class="space-y-1"></ul>
        </div>
      </div>

      <!-- Playback UI (Initially Hidden) -->
      <div id="library-playback-ui" class="hidden absolute inset-0 flex-col items-center justify-center bg-surface/80 backdrop-blur-sm transition-opacity duration-300">
        <div id="library-pinyin-display" class="font-headline text-8xl font-black text-on-surface"></div>
        <button id="library-play-btn" class="mt-8 w-24 h-24 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shadow-lg hover:scale-105 transition-transform">
            <span class="material-symbols-outlined text-5xl">play_arrow</span>
        </button>
      </div>
    </main>

    <footer class="p-4 shrink-0">
      <div id="tone-selector" class="flex items-center justify-center gap-2 hidden">
        <button data-tone="1" class="tone-select-btn w-12 h-12 rounded-full bg-surface-container-low hover:bg-primary-container transition-colors">1</button>
        <button data-tone="2" class="tone-select-btn w-12 h-12 rounded-full bg-surface-container-low hover:bg-primary-container transition-colors">2</button>
        <button data-tone="3" class="tone-select-btn w-12 h-12 rounded-full bg-surface-container-low hover:bg-primary-container transition-colors">3</button>
        <button data-tone="4" class="tone-select-btn w-12 h-12 rounded-full bg-surface-container-low hover:bg-primary-container transition-colors">4</button>
      </div>
    </footer>
    <script type="module" src="/src/library_v2.js"></script>
  </body>
</html>
